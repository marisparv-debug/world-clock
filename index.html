<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World Clock - Mariana</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">
      <h1>World Clock</h1>
      <select name="" id="">
        <option value="">Select a city...</option>
        <option value="">London</option>
        <option value="">New York</option>
        <option value="">Auckland</option>
      </select>
      <div class="city">
        <div>
          <h2>Los Angeles 🪽</h2>
          <div class="date">August 14th 2026</div>
        </div>
        <div class="time">21:17:50 <small>PM</small></div>
      </div>
      <div class="city">
        <div>
          <h2>Paris 🥐</h2>
          <div class="date">August 14th 2026</div>
        </div>
        <div class="time">21:17:50 <small>PM</small></div>
      </div>
    </div>
    <footer>
      This project was coded with ❤️ by <strong>Mariana</strong> and is
      <a href="https://github.com/marisparv-debug/world-clock" target="_blank"
        >open sourced on GitHub</a
      >.
    </footer>
    <script src="javascript/index.js"></script>
  </body>
</html>
